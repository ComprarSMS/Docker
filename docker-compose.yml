name: quierounsms

# Desde esta carpeta:
#   docker compose up --build
# Solo Postgres y Redis, con las apps en caliente:
#   docker compose up -d postgres redis

services:
  postgres:
    image: postgres:16-alpine
    container_name: quierounsms-postgres
    environment:
      POSTGRES_USER: quierounsms
      POSTGRES_PASSWORD: quierounsms
      POSTGRES_DB: quierounsms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quierounsms -d quierounsms"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: quierounsms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: quierounsms-backend
    environment:
      DATABASE_URL: postgresql://quierounsms:quierounsms@postgres:5432/quierounsms?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      RENTAL_TTL_SECONDS: 180
      SMS_DELAY_MS: 5000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    container_name: quierounsms-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
